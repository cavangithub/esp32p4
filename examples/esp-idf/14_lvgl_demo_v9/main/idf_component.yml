## IDF Component Manager Manifest File

## use local component directory ##
dependencies:
  lvgl/lvgl:
    version: "^9.*"
    public: true

  espressif/esp_wifi_remote:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=1.6,<2.0"
      - if: "idf_version < 6.0"
        version: "0.14.*"

  espressif/esp_hosted:
    matches:
      - if: "idf_version >= 6.0"
        version: ">=2.12,<3.0"
      - if: "idf_version < 6.0"
        version: "1.4.*"

  usb_host_msc: "^1.1.1"

  espressif/esp_new_jpeg: "^1.*"
